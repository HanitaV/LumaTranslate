name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rust workspace unit & pipeline integration tests
        working-directory: backend
        run: cargo test --workspace --toolchain stable-x86_64-pc-windows-msvc

      - name: Run Python worker protocol unit tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/unit -v

      - name: Build Windows x64 AppData Installer (.exe) & Portable (.zip)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $installerName = "LumaTranslate-Setup-${{ github.ref_name }}-x64"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1 `
            -AppVersion $version `
            -InstallerBaseName $installerName `
            -RequireInstaller
          Compress-Archive -Path dist/LumaTranslate-win-x64/* -DestinationPath "dist/LumaTranslate-${{ github.ref_name }}-win-x64-portable.zip" -Force

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LumaTranslate-Setup-${{ github.ref_name }}-x64.exe
            dist/LumaTranslate-${{ github.ref_name }}-win-x64-portable.zip
