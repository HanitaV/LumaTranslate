[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/regions",
    "crates/capture",
    "crates/ocr-client",
    "crates/translation",
    "crates/tts-client",
    "crates/audio",
    "crates/storage",
    "crates/ipc",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rodio = { version = "0.19", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.58", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

luma-core = { path = "crates/core" }
luma-regions = { path = "crates/regions" }
luma-capture = { path = "crates/capture" }
luma-ocr-client = { path = "crates/ocr-client" }
luma-translation = { path = "crates/translation" }
luma-tts-client = { path = "crates/tts-client" }
luma-audio = { path = "crates/audio" }
luma-storage = { path = "crates/storage" }
luma-ipc = { path = "crates/ipc" }
